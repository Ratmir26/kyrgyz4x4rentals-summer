    - generic [ref=e265]:
      - heading "Условия аренды (Terms and Conditions)" [level=2] [ref=e266]
      - paragraph [ref=e267]: Ознакомьтесь с правилами эксплуатации автомобилей и правилами возврата депозита.
    - generic [ref=e268]:
      - generic [ref=e269]:
        - heading " General / Общие условия" [level=3] [ref=e270]:
          - generic [ref=e271]: 
          - generic [ref=e272]: General / Общие условия
        - list [ref=e273]:
          - listitem [ref=e274]: • The vehicle may not be transferred to a third party. (Транспортное средство не может быть передано третьим лицам).
          - listitem [ref=e275]: • The vehicle must be returned clean. (Автомобиль должен быть возвращен в чистом виде).
          - listitem [ref=e276]:
            - text: "• The client is responsible to safely operate the vehicle:"
            - list [ref=e277]:
              - listitem [ref=e278]: ▪ The client must ensure that the vehicle remains in roadworthy condition.
              - listitem [ref=e279]: ▪ Oil and Coolant must be checked regularly. (Масло и охлаждающая жидкость должны проверяться регулярно).
              - listitem [ref=e280]: ▪ Tires and tire pressure should be observed regularly. (Шины и давление в шинах должны регулярно проверяться).
              - listitem [ref=e281]: ▪ “Kyrgyz4x4rentals” must be notified immediately if the vehicle has reached its service interval.
              - listitem [ref=e282]: ▪ Small repairs (up to 100 USD) of a non-critical nature may be performed by the client, but will not be reimbursed without prior agreement by “Kyrgyz4x4rentals”.
              - listitem [ref=e283]: ▪ Major repairs (over 100 USD) may only be performed with “Kyrgyz4x4rentals’” approval.
          - listitem [ref=e284]: • All road fines are the responsibility of the driver. (Все штрафы за нарушения ПДД лежат на ответственности водителя).
          - listitem [ref=e285]: • Damage resulting from negligence (i.e. use of incorrect fuel, ignoring gauges/warning lights, unjustified off roading etc.) is not covered by insurance and will be charged to the driver/client.
          - listitem [ref=e286]: • Ignoring the instructions of any “Kyrgyz4x4rentals” staff or representative will result in the forfeit of the security deposit.
          - listitem [ref=e287]: • The client must keep the vehicle locked when not present with the vehicle.
          - listitem [ref=e288]: • Breakdowns and problems as a result of the client’s negligence will be charged in full to the client, including any recovery fees incurred by “Kyrgyz4x4rentals”.
          - listitem [ref=e289]: • The client is responsible to follow all laws and regulations of the country in which they are operating the vehicle. Any legal fees incurred by “Kyrgyz4x4rentals” as a result of the client’s actions will be charged to the client.
          - listitem [ref=e290]: "• Регионы приема/сдачи: Прием и возврат машины в других регионах помимо Бишкека обсуждается индивидуально с клиентом при обращении по контактам."
      - generic [ref=e291]:
        - heading " Breakdowns / Поломки и Досрочный возврат" [level=3] [ref=e292]:
          - generic [ref=e293]: 
          - generic [ref=e294]: Breakdowns / Поломки и Досрочный возврат
        - list [ref=e295]:
          - listitem [ref=e296]: • If the client wants to return the car during the trip for his own reason, the company does not return the money for the remaining days, as the order of other orders will be violated. (При досрочном возврате по инициативе клиента оплата за оставшиеся дней не возвращается).
          - listitem [ref=e297]: • Breakdowns are an unfortunate part of life in Central Asia. In the event that your vehicle breaks down, please inform “Kyrgyz4x4rentals” immediately.
          - listitem [ref=e298]: • Inside Kyrgyzstan “Kyrgyz4x4rentals” or its representative will repair the vehicle or supply an alternative. If no alternative options suitable to the client can be arranged, then a refund of the unused days will be made.
          - listitem [ref=e299]: • “Kyrgyz4x4rentals” is not obligated to refund lost time due to a breakdown and will do so only at its discretion.
      - generic [ref=e300]:
        - heading " Insurance & Deposit Return / Страховка и Возврат депозита" [level=3] [ref=e301]:
          - generic [ref=e302]: 
          - generic [ref=e303]: Insurance & Deposit Return / Страховка и Возврат депозита
        - list [ref=e304]:
          - listitem [ref=e305]: "• Deductible (Депозит / Франшиза): 800 euro."
          - listitem [ref=e306]: "• Условие возврата депозита: Если при возврате машины не выявится внарушений ПДД, штрафов а повреждений кузова/интерьера, залог возвращается клиенту в полном объеме (800€) при жавершении поездки! Если выявляются внарушения, царапины или штрафы — соответствующая сумма вычитается (минусуется) из депозита."
          - listitem [ref=e307]: • “Kyrgyz4x4rentals” will not refund lost time due to an accident.
