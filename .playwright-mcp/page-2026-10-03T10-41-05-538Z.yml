        - list [ref=e273]:
          - listitem [ref=e274]: • The vehicle may not be transferred to a third party.
          - listitem [ref=e275]: • The vehicle must be returned clean.
          - listitem [ref=e276]:
            - text: "• The client is responsible to safely operate the vehicle:"
            - list [ref=e277]:
              - listitem [ref=e278]: ▪ The client must ensure that the vehicle remains in roadworthy condition.
              - listitem [ref=e279]: ▪ Oil and Coolant must be checked regularly.
              - listitem [ref=e280]: ▪ Tires and tire pressure should be observed regularly.
              - listitem [ref=e281]: ▪ “Kyrgyz4x4rentals” must be notified immediately if the vehicle has reached its service interval.
              - listitem [ref=e282]: ▪ Small repairs (up to 100 USD) of a non-critical nature may be performed by the client, but will not be reimbursed without prior agreement by “Kyrgyz4x4rentals”.
              - listitem [ref=e283]: ▪ Major repairs (over 100 USD) may only be performed with “Kyrgyz4x4rentals’” approval.
          - listitem [ref=e284]: • All road fines are the responsibility of the driver.
          - listitem [ref=e285]: • Damage resulting from negligence (i.e. use of incorrect fuel, ignoring gauges/warning lights, unjustified off roading etc.) is not covered by insurance and will be charged to the driver/client.
          - listitem [ref=e286]: • Ignoring the instructions of any “Kyrgyz4x4rentals” staff or representative will result in the forfeit of the security deposit.
          - listitem [ref=e287]: • The client must keep the vehicle locked when not present with the vehicle.
          - listitem [ref=e288]: • Breakdowns and problems as a result of the client’s negligence will be charged in full to the client, including any recovery fees incurred by “Kyrgyz4x4rentals”.
          - listitem [ref=e289]: • The client is responsible to follow all laws and regulations of the country in which they are operating the vehicle. Any legal fees incurred by “Kyrgyz4x4rentals” as a result of the client’s actions will be charged to the client.
